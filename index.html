<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<title>Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{
  --surface-0:#f4f3ef;--surface-1:#ffffff;--surface-2:#ffffff;
  --text-primary:#1a1a1a;--text-secondary:#66655f;--text-muted:#8a8984;
  --border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.2);--border-stronger:rgba(0,0,0,.4);
  --bg-neutral:rgba(0,0,0,.05);
  --fill-accent:#378ADD;--bg-accent:rgba(55,138,221,.13);--text-accent:#185FA5;--border-accent:rgba(55,138,221,.55);
  --fill-success:#3B6D11;--on-success:#fff;--bg-success:rgba(99,153,34,.16);--text-success:#3B6D11;--border-success:rgba(99,153,34,.55);
  --text-danger:#A32D2D;--border-danger:rgba(226,75,74,.5);--text-warning:#854F0B;
  --fill-primary:#191919;--on-primary:#fff;--radius:10px;
}
@media (prefers-color-scheme: dark){:root{
  --surface-0:#111111;--surface-1:#1c1c1c;--surface-2:#161616;
  --text-primary:#eeeeee;--text-secondary:#a3a3a0;--text-muted:#77766f;
  --border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.2);--border-stronger:rgba(255,255,255,.45);
  --bg-neutral:rgba(255,255,255,.07);
  --bg-accent:rgba(55,138,221,.2);--text-accent:#85B7EB;--border-accent:rgba(133,183,235,.55);
  --fill-success:#639922;--bg-success:rgba(99,153,34,.22);--text-success:#97C459;--border-success:rgba(151,196,89,.55);
  --text-danger:#F09595;--border-danger:rgba(240,149,149,.5);--text-warning:#FAC775;
  --fill-primary:#efefef;--on-primary:#111;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:var(--text-primary)}
button{background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
input,select{background:var(--surface-1);border:0.5px solid var(--border-strong);border-radius:var(--radius);height:40px;padding:0 10px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--fill-accent)}
b{font-weight:600}
.app{max-width:520px;margin:0 auto;min-height:100vh}
.hd{position:sticky;top:0;z-index:5;background:var(--surface-0);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#v{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface-2);border-top:0.5px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nv>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nv button{border:none;border-radius:0;padding:9px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-muted)}
.nv button.on{color:var(--text-primary)}
.cd{border:0.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--surface-1)}
.mu{font-size:13px;color:var(--text-secondary)}
.sr{display:grid;grid-template-columns:24px 1fr 66px 56px 46px;gap:6px;align-items:center;font-size:14px;margin-top:6px}
.sr input{height:44px;padding:0 4px;text-align:center;width:100%}
.ck{height:44px;width:46px;padding:0;display:flex;align-items:center;justify-content:center}
.ck.dn{background:var(--fill-success);color:var(--on-success);border-color:var(--fill-success)}
.sr.dn input{background:var(--bg-success)}
.bt{width:100%;margin-top:8px;height:44px}
.pr{background:var(--fill-primary);color:var(--on-primary);border-color:var(--fill-primary)}
.er{font-size:13px;color:var(--text-danger);margin-top:6px}
.cl{cursor:pointer}
.tg{font-size:11px;padding:2px 7px;border-radius:8px;display:inline-block;margin:2px 4px 0 0}
.bar{height:6px;background:var(--bg-neutral);border-radius:3px;overflow:hidden}
.bar div{height:6px;background:var(--fill-accent)}
.mt{background:var(--bg-neutral);border-radius:var(--radius);padding:10px}
.ic{display:flex;gap:16px;font-size:20px;color:var(--text-secondary)}
.ic i.on{color:var(--text-accent)}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <span id="ttl" style="font-size:20px;font-weight:600">Training</span>
    <span style="display:flex;align-items:center;gap:12px"><span id="clk" class="mu"></span><i class="ti ti-settings cl" style="font-size:22px;color:var(--text-secondary)" onclick="go('set')" aria-label="Einstellungen"></i></span>
  </div>
  <div id="v"></div>
</div>
<div class="nv"><div id="nav">
  <button data-t="train" onclick="go('train')"><i class="ti ti-barbell" style="font-size:22px"></i>Training</button>
  <button data-t="plans" onclick="go('plans')"><i class="ti ti-list-details" style="font-size:22px"></i>Pläne</button>
  <button data-t="stats" onclick="go('stats')"><i class="ti ti-chart-line" style="font-size:22px"></i>Fortschritt</button>
  <button data-t="ex" onclick="go('ex')"><i class="ti ti-books" style="font-size:22px"></i>Übungen</button>
  <button data-t="hist" onclick="go('hist')"><i class="ti ti-history" style="font-size:22px"></i>Verlauf</button>
</div></div>

<script>
// ---------- Grundeinstellungen ----------
const REST = 180;                 // Pause in Sekunden (3 Minuten)
const C = 2 * Math.PI * 30;       // Umfang des Pausenrings
const KEY = 'gymapp-v1';          // Speicher-Schlüssel im iPhone
const G = ['Brust','Rücken','Schultern','Arme','Beine','Core'];
const GC = ['#D85A30','#378ADD','#7F77DD','#BA7517','#1D9E75','#D4537E'];
const BB = ['Bankdrücken','Kniebeuge','Kreuzheben','Langhantelrudern','Rumänisches Kreuzheben','Schulterdrücken'];

// ---------- Startdaten (nur beim allerersten Öffnen) ----------
function defaults(){
  const ex = [['Bankdrücken',0],['Schrägbankdrücken KH',0],['Butterfly',0],['Schulterdrücken',2],['Seitheben',2],['Face pulls',2],
    ['Trizepsdrücken Kabel',3],['Bizepscurls',3],['Klimmzüge',1],['Langhantelrudern',1],['Latzug',1],['Kreuzheben',1],
    ['Kniebeuge',4],['Rumänisches Kreuzheben',4],['Beinpresse',4],['Beinbeuger',4],['Wadenheben',4],['Plank',5]]
    .map(e => ({n:e[0], g:e[1], note:''}));
  const fx = n => ex.findIndex(e => e.n === n);
  const plans = [
    {n:'Push', it:[['Bankdrücken',4,8],['Schrägbankdrücken KH',3,10],['Schulterdrücken',3,10],['Seitheben',3,12],['Trizepsdrücken Kabel',3,12]]},
    {n:'Pull', it:[['Klimmzüge',4,8],['Langhantelrudern',4,8],['Latzug',3,10],['Face pulls',3,15],['Bizepscurls',3,12]]},
    {n:'Beine', it:[['Kniebeuge',4,6],['Rumänisches Kreuzheben',3,8],['Beinpresse',3,12],['Beinbeuger',3,12],['Wadenheben',4,15]]}
  ].map(p => ({n:p.n, it:p.it.map(i => ({e:fx(i[0]), s:i[1], r:i[2]}))}));
  return {ex, plans, hist:[], bw:[], act:null, rest:0};
}

// ---------- Laden & Speichern ----------
let D;
try { D = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch(e){ D = defaults(); }
let {ex, plans, hist, bw, act, rest} = D;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ex, plans, hist, bw, act, rest})); } catch(e){}
}
// iOS bitten, die Daten nicht automatisch zu löschen
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

let tab = 'train', sub = null, err = '', sum = null, conf = '', msg = '';

// ---------- Hilfsfunktionen ----------
const $ = id => document.getElementById(id);
const nf = n => (Math.round(n*100)/100).toLocaleString('de-DE');
const dt = t => new Date(t).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const mm = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const num = v => { const x = parseFloat(String(v).replace(',','.')); return isNaN(x) ? null : x; };
const e1 = (w,r) => w*(1+r/30);   // geschätztes 1RM (Epley)
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const tg = g => `<span class="tg" style="background:${GC[g]}26;color:${GC[g]}">${G[g]}</span>`;
const dot = g => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${GC[g]};margin-right:6px;vertical-align:1px"></span>`;
const pg = p => [...new Set(p.it.map(x => ex[x.e].g))];

function prev(e){ for (let i=hist.length-1;i>=0;i--){ const x = hist[i].x.find(y => y.e===e); if (x) return x.s; } return null; }
// Steigerung vorschlagen, wenn letztes Mal alle Wiederholungen geschafft wurden
function sug(e,tr){
  const p = prev(e); if (!p) return null;
  const mx = Math.max(...p.map(s => s.w));
  if (tr && mx>0 && p.every(s => s.r>=tr)) return {w:mx+(mx>=30?2.5:1), r:tr, up:true};
  return {w:mx, r:null, up:false};
}
function vol(h){ return h.x.reduce((a,x) => a + x.s.reduce((b,s) => b + s.w*s.r, 0), 0); }
function best(e){ let m=-1; hist.forEach(h => h.x.forEach(x => { if (x.e===e) x.s.forEach(s => { if (s.w>m) m=s.w; }); })); return m; }
function day0(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function wk0(t){ const d=new Date(day0(t||Date.now())); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function go(t){ tab=t; sub=null; err=''; conf=''; msg=''; render(); window.scrollTo(0,0); }
function opts(sel){ return ex.map((e,i) => `<option value="${i}" ${i===sel?'selected':''}>${esc(e.n)}</option>`).join(''); }

// ---------- Scheibenrechner (20-kg-Stange) ----------
function plates(w){ let r=(w-20)/2; if (r<0) return null; const o=[]; for (const p of [25,20,15,10,5,2.5,1.25]) while (r>=p-1e-9){ o.push(p); r-=p; } return {o, rest:r}; }
const PH = {25:[46,'#E24B4A'],20:[42,'#378ADD'],15:[36,'#EF9F27'],10:[30,'#639922'],5:[24,'#888780'],2.5:[19,'#888780'],1.25:[15,'#888780']};
function plateViz(w){
  const p = plates(w); if (!p) return '<div class="mu">Unter 20 kg, nur die Stange.</div>';
  return `<div style="display:flex;align-items:center;gap:3px;height:50px"><div style="width:34px;height:6px;background:var(--border-stronger);border-radius:2px"></div><div style="width:6px;height:22px;background:var(--border-stronger);border-radius:2px"></div>${p.o.map(x => `<div style="width:${x>=10?12:9}px;height:${PH[x][0]}px;background:${PH[x][1]};border-radius:3px"></div>`).join('')}<div style="flex:1;height:6px;background:var(--border-stronger);border-radius:2px;max-width:40px"></div></div><div class="mu">Pro Seite: ${p.o.length ? p.o.map(nf).join(' + ')+' kg' : 'keine Scheiben'}${p.rest>0.01?' (Rest '+nf(p.rest*2)+' kg geht nicht auf)':''} · Stange 20 kg</div>`;
}

// ---------- Training ----------
const newSet = () => ({w:'', r:'', d:false, wu:false});
function start(pi){
  act = {p: pi<0 ? 'Freies Training' : plans[pi].n, t0: Date.now(),
    x: pi<0 ? [] : plans[pi].it.map(i => ({e:i.e, tr:i.r, t:i.s+' × '+i.r, ui:'', s:Array.from({length:i.s}, newSet)}))};
  tab='train'; conf=''; render();
}
function setv(i,j,k,v){
  act.x[i].s[j][k] = v; save();
  // Platzhalter der folgenden Sätze aktualisieren
  const y = act.x[i];
  for (let q=j+1;q<y.s.length;q++){ const el=$('i'+k+i+'_'+q); if (el && !y.s[q].d){ const h=ph(i,q); el.placeholder = k==='w' ? (h.w!==null?nf(h.w):'kg') : (h.r!==null?h.r:'0'); } }
}
// Vorschlagswerte für einen Satz
function ph(i,j){
  const y=act.x[i], g=sug(y.e,y.tr), p=prev(y.e); let w=null, r=null;
  if (g && g.up){ w=g.w; r=g.r; }
  else { const ps = p ? p[Math.min(j,p.length-1)] : null; if (ps){ w=ps.w; r=ps.r; } else r=y.tr||null; }
  for (let q=j-1;q>=0;q--){ const s=y.s[q]; if (s.wu) continue; if (s.w!==''){ w=num(s.w); break; } }
  return {w, r};
}
function tick(i,j){
  const s=act.x[i].s[j], h=ph(i,j);
  if (!s.d){
    if (s.w==='' && h.w!==null) s.w=h.w;
    if (s.r==='' && h.r!==null) s.r=h.r;
    if (num(s.w)===null || num(s.r)===null){ err=i+'-'+j; render(); return; }
    s.d=true; rest=Date.now()+REST*1000;
  } else s.d=false;
  err=''; render();
}
function wu(i,j){ act.x[i].s[j].wu = !act.x[i].s[j].wu; render(); }
function ui(i,k){ act.x[i].ui = act.x[i].ui===k ? '' : k; render(); }
function swap(i,v){ const y=act.x[i]; y.e=+v; y.ui=''; y.s.forEach(s => { s.w=''; s.r=''; s.d=false; }); render(); }
function addSet(i){ act.x[i].s.push(newSet()); render(); }
function addEx(){ act.x.push({e:+$('ae').value, tr:null, t:'', ui:'', s:[newSet(),newSet(),newSet()]}); render(); }
function rmEx(i){ act.x.splice(i,1); render(); }
function radj(d){ rest = d===0 ? 0 : Math.max(Date.now()+1000, rest+d*1000); render(); }
function nextUp(){ if (!act) return null; for (let i=0;i<act.x.length;i++) for (let j=0;j<act.x[i].s.length;j++) if (!act.x[i].s[j].d) return {i,j}; return null; }
function finish(){
  const x = act.x.map(y => ({e:y.e, s:y.s.filter(s => s.d && !s.wu).map(s => ({w:num(s.w), r:num(s.r)}))})).filter(y => y.s.length);
  if (!x.length){ err='fin'; render(); return; }
  const prs = x.map(y => { const b=best(y.e), m=Math.max(...y.s.map(s => s.w)); return b>=0 && m>b ? {n:ex[y.e].n, m, b} : null; }).filter(Boolean);
  const last = [...hist].reverse().find(h => h.p===act.p);
  const h = {d:Date.now(), p:act.p, dur:Math.max(1, Math.round((Date.now()-act.t0)/6e4)), x};
  hist.push(h);
  sum = {h, prs, lv: last ? vol(last) : null, saved:false};
  act=null; rest=0; err=''; tab='sum'; render(); window.scrollTo(0,0);
}
function nextPlan(){ for (let i=hist.length-1;i>=0;i--){ const k=plans.findIndex(p => p.n===hist[i].p); if (k>=0) return (k+1)%plans.length; } return 0; }
function banner(){ return act ? `<div class="cd cl" onclick="go('train')" style="background:var(--bg-accent);border-color:var(--border-accent);display:flex;justify-content:space-between;align-items:center;color:var(--text-accent)"><span><i class="ti ti-player-play"></i> ${esc(act.p)} läuft</span><span>Zurück <i class="ti ti-arrow-right"></i></span></div>` : ''; }

function vTrain(){
  if (act){
    const all=act.x.flatMap(y => y.s), tot=all.length, dn=all.filter(s => s.d).length, nu=nextUp();
    let o = `<div style="display:flex;justify-content:space-between" class="mu"><span>${dn} von ${tot} Sätzen</span><span>${nf(all.filter(s => s.d && !s.wu).reduce((b,s) => b+num(s.w)*num(s.r), 0))} kg Volumen</span></div><div class="bar" style="margin:6px 0 12px"><div style="width:${tot?Math.round(dn/tot*100):0}%;background:var(--fill-success)"></div></div>`;
    if (rest>Date.now()){
      const rem=(rest-Date.now())/1000; let nx='Alle Sätze erledigt';
      if (nu){ const y=act.x[nu.i], h=ph(nu.i,nu.j); nx = `${esc(ex[y.e].n)} · Satz ${nu.j+1}${h.w!==null?' · '+nf(h.w)+' kg':''}${h.r?' × '+h.r:''}`; }
      o += `<div class="cd" style="background:var(--bg-accent);border-color:var(--border-accent)"><div style="display:flex;gap:14px;align-items:center"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--border-accent)" stroke-width="6"/><circle id="rr" cx="36" cy="36" r="30" fill="none" stroke="#378ADD" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-rem/REST)}" transform="rotate(-90 36 36)"/><text id="rt" x="36" y="41" text-anchor="middle" style="font-size:16px;font-weight:600;fill:var(--text-accent)">${mm(rem)}</text></svg><div style="flex:1;color:var(--text-accent)"><div style="font-size:12px">Als Nächstes</div><div style="font-size:14px;font-weight:600">${nx}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><button onclick="radj(-30)">−30 s</button><button onclick="radj(30)">+30 s</button><button onclick="radj(0)">Weiter</button></div></div>`;
    }
    act.x.forEach((y,i) => {
      const p=prev(y.e), g=sug(y.e,y.tr), ad=y.s.length && y.s.every(s => s.d), E=ex[y.e], bb=BB.includes(E.n);
      o += `<div class="cd" style="${ad?'border-color:var(--border-success)':''}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-weight:600">${dot(E.g)}${esc(E.n)}${ad?' <i class="ti ti-circle-check" style="color:var(--text-success)"></i>':''}</span>
      <span class="ic"><i class="ti ti-note cl ${y.ui==='n'?'on':''}" onclick="ui(${i},'n')"></i>${bb?`<i class="ti ti-disc cl ${y.ui==='p'?'on':''}" onclick="ui(${i},'p')"></i>`:''}<i class="ti ti-replace cl ${y.ui==='s'?'on':''}" onclick="ui(${i},'s')"></i><i class="ti ti-x cl" onclick="rmEx(${i})"></i></span></div>
      <div class="mu">${y.t?'Ziel '+y.t+' · ':''}${p?'Letztes Mal '+p.map(s => nf(s.w)+'×'+s.r).join(', '):'Noch keine Werte'}</div>
      ${E.note && y.ui!=='n' ? `<div class="mu" style="margin-top:4px"><i class="ti ti-note"></i> ${esc(E.note)}</div>` : ''}
      ${y.ui==='n' ? `<input value="${esc(E.note)}" placeholder="Sitzhöhe 4, enger Griff" oninput="ex[${y.e}].note=this.value;save()" style="width:100%;margin-top:8px">` : ''}
      ${y.ui==='s' ? `<select onchange="swap(${i},this.value)" style="width:100%;margin-top:8px">${opts(y.e)}</select>` : ''}
      ${y.ui==='p' ? (() => { const q=nextUp(), j=q&&q.i===i?q.j:0, s=y.s[j]||newSet(), w=s.w!==''?num(s.w):(y.s.length?ph(i,j).w:null); return `<div class="mt" style="margin-top:8px"><div style="font-size:13px;font-weight:600">Scheiben für ${w!==null?nf(w)+' kg':'–'}</div>${w!==null?plateViz(w):''}</div>`; })() : ''}
      ${g && g.up ? `<div style="margin-top:6px"><span class="tg" style="background:var(--bg-success);color:var(--text-success)"><i class="ti ti-trending-up"></i> Alle Wdh. geschafft, heute ${nf(g.w)} kg</span></div>` : ''}
      <div class="sr mu" style="font-size:12px"><span>#</span><span>Vorher</span><span style="text-align:center">kg</span><span style="text-align:center">Wdh</span><span></span></div>`;
      y.s.forEach((s,j) => {
        const ps=p?p[Math.min(j,p.length-1)]:null, h=ph(i,j), cur=nu&&nu.i===i&&nu.j===j;
        const nr = j+1-y.s.slice(0,j).filter(z => z.wu).length;
        o += `<div class="sr ${s.d?'dn':''}"><span class="cl" onclick="wu(${i},${j})" style="text-align:center;font-weight:600;${s.wu?'color:var(--text-warning)':cur?'color:var(--text-accent)':'color:var(--text-secondary)'}">${s.wu?'A':nr}</span><span class="mu">${s.wu?'Aufwärmen':ps?nf(ps.w)+' × '+ps.r:'–'}</span>
        <input id="iw${i}_${j}" inputmode="decimal" value="${s.w}" placeholder="${h.w!==null?nf(h.w):'kg'}" oninput="setv(${i},${j},'w',this.value)" ${cur?'style="border-color:var(--fill-accent)"':''}>
        <input id="ir${i}_${j}" inputmode="numeric" value="${s.r}" placeholder="${h.r!==null?h.r:'0'}" oninput="setv(${i},${j},'r',this.value)" ${cur?'style="border-color:var(--fill-accent)"':''}>
        <button class="ck ${s.d?'dn':''}" onclick="tick(${i},${j})"><i class="ti ti-check" style="font-size:20px"></i></button></div>`;
        if (err===i+'-'+j) o += `<div class="er">Trag erst Gewicht und Wiederholungen ein.</div>`;
      });
      o += `<button class="bt" onclick="addSet(${i})"><i class="ti ti-plus"></i> Satz</button></div>`;
    });
    o += `<div style="display:flex;gap:6px;margin-bottom:6px"><select id="ae" style="flex:1;min-width:0">${opts()}</select><button onclick="addEx()">Hinzufügen</button></div>
    <button class="bt pr" onclick="finish()">Training beenden</button>${err==='fin'?'<div class="er">Hake mindestens einen Satz ab.</div>':''}
    ${conf==='c' ? `<div class="cd" style="margin-top:8px;border-color:var(--border-danger)"><div style="font-size:14px">Training verwerfen? Eingetragene Sätze gehen verloren.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="act=null;rest=0;conf='';render()" style="color:var(--text-danger)">Verwerfen</button><button onclick="conf='';render()">Weitertrainieren</button></div></div>` : `<button class="bt" onclick="conf='c';render()">Abbrechen</button>`}`;
    return o;
  }
  // Startseite
  const w0=wk0(), wh=hist.filter(h => h.d>=w0), np=nextPlan(), td=day0(Date.now());
  const days = ['Mo','Di','Mi','Do','Fr','Sa','So'].map((n,k) => { const d=w0+k*864e5, h=hist.find(x => day0(x.d)===d); return {n,d,h}; });
  let streak=0; for (let k=0;k<104;k++){ const a=w0-k*7*864e5; if (hist.some(h => h.d>=a && h.d<a+7*864e5)) streak++; else if (k>0) break; }
  let o = `<div class="cd"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-weight:600">Diese Woche</span><span class="mu"><i class="ti ti-flame"></i> ${streak} ${streak===1?'Woche':'Wochen'} am Stück</span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">${days.map(x => { const g=x.h&&x.h.x.length?ex[x.h.x[0].e].g:0; return `<div><div class="mu" style="font-size:11px">${x.n}</div><div style="margin:4px auto 0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;${x.h?`background:${GC[g]};color:#fff`:'background:var(--bg-neutral);color:var(--text-muted)'};${x.d===td?'outline:2px solid var(--fill-accent);outline-offset:2px':''}">${x.h?esc(x.h.p.slice(0,4)):new Date(x.d).getDate()}</div></div>`; }).join('')}</div></div>`;
  o += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">${[['Trainings',wh.length],['Volumen',nf(Math.round(wh.reduce((a,h) => a+vol(h),0)/100)/10)+' t'],['Gesamt',hist.length]].map(m => `<div class="mt"><div class="mu" style="font-size:12px">${m[0]}</div><div style="font-weight:600;font-size:16px">${m[1]}</div></div>`).join('')}</div>`;
  if (plans.length){
    const P=plans[np], ds=hist.filter(h => h.p===P.n).slice(-3), ad=ds.length?Math.round(ds.reduce((a,h) => a+h.dur,0)/ds.length):null;
    o += `<div class="cd" style="border:2px solid var(--border-accent)"><div class="mu">Als Nächstes dran</div><div style="font-size:24px;font-weight:600">${esc(P.n)}</div><div>${pg(P).map(tg).join('')}</div><div class="mu" style="margin-top:6px">${P.it.length} Übungen · ${P.it.reduce((a,x) => a+x.s,0)} Sätze${ad?' · ca. '+ad+' min':''}</div><button class="bt pr" onclick="start(${np})"><i class="ti ti-player-play"></i> Training starten</button></div>`;
  }
  if (plans.length>1) o += `<div class="mu" style="margin:14px 0 6px">Andere Pläne</div>`;
  plans.forEach((p,i) => { if (i===np) return; const lh=[...hist].reverse().find(h => h.p===p.n);
    o += `<div class="cd" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:600">${esc(p.n)}</div><div>${pg(p).map(tg).join('')}</div><div class="mu">zuletzt ${lh?dt(lh.d):'nie'}</div></div><button onclick="start(${i})">Start</button></div>`; });
  return o + `<button class="bt" onclick="start(-1)">Freies Training</button>`;
}

function saveAsPlan(){ const h=sum.h; plans.push({n:'Plan '+(plans.length+1), it:h.x.map(x => ({e:x.e, s:x.s.length, r:Math.max(...x.s.map(s => s.r))}))}); sum.saved=true; render(); }
function vSum(){
  const h=sum.h, n=h.x.reduce((a,x) => a+x.s.length,0), v=vol(h), dv=sum.lv?Math.round((v/sum.lv-1)*100):null;
  const mx=Math.max(1,...h.x.map(x => x.s.reduce((a,s) => a+s.w*s.r,0)));
  return `<div style="text-align:center;margin:10px 0 16px"><div style="width:56px;height:56px;border-radius:50%;background:var(--bg-success);color:var(--text-success);display:flex;align-items:center;justify-content:center;margin:0 auto 8px"><i class="ti ti-trophy" style="font-size:26px"></i></div><div style="font-size:18px;font-weight:600">Training gespeichert</div><div class="mu">${esc(h.p)}</div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">${[['Dauer',h.dur+' min'],['Sätze',n],['Volumen',nf(v)+' kg']].map(m => `<div class="mt"><div class="mu" style="font-size:12px">${m[0]}</div><div style="font-weight:600">${m[1]}</div></div>`).join('')}</div>
  ${dv!==null ? `<div class="cd" style="display:flex;justify-content:space-between;align-items:center"><span>Volumen vs. letztes ${esc(h.p)}</span><span style="font-weight:600;color:${dv>=0?'var(--text-success)':'var(--text-danger)'}">${dv>=0?'+':''}${dv} %</span></div>` : ''}
  <div class="cd"><div style="font-weight:600;margin-bottom:4px">Neue Bestwerte</div>${sum.prs.length ? sum.prs.map(p => `<div style="font-size:14px;padding:3px 0"><i class="ti ti-medal" style="color:var(--text-warning)"></i> ${esc(p.n)}: <b>${nf(p.m)} kg</b> <span class="mu">(vorher ${nf(p.b)})</span></div>`).join('') : '<div class="mu">Diesmal keine.</div>'}</div>
  <div class="cd"><div style="font-weight:600;margin-bottom:4px">Volumen pro Übung</div>${h.x.map(x => { const xv=x.s.reduce((a,s) => a+s.w*s.r,0); return `<div style="font-size:13px;margin-top:6px">${dot(ex[x.e].g)}${esc(ex[x.e].n)}<span class="mu" style="float:right">${nf(xv)} kg</span></div><div class="bar" style="margin-top:3px"><div style="width:${Math.round(xv/mx*100)}%;background:${GC[ex[x.e].g]}"></div></div>`; }).join('')}</div>
  ${h.p==='Freies Training' ? (sum.saved ? '<div class="mu" style="text-align:center">Als Plan gespeichert, du findest ihn unter Pläne.</div>' : `<button class="bt" onclick="saveAsPlan()"><i class="ti ti-device-floppy"></i> Als Plan speichern</button>`) : ''}
  <button class="bt pr" onclick="go('train')">Fertig</button>`;
}

// ---------- Pläne ----------
function pUpd(k,i,v){ const p=plans[sub]; if (k==='n') p.n=v; else p.it[i][k]=Math.max(1, parseInt(v)||1); save(); }
function pMv(i,d){ const a=plans[sub].it, j=i+d; if (j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; render(); }
function pRm(i){ plans[sub].it.splice(i,1); render(); }
function pAdd(){ plans[sub].it.push({e:+$('pe').value, s:3, r:10}); render(); }
function pNew(){ plans.push({n:'Neuer Plan', it:[]}); sub=plans.length-1; render(); }
function pDup(){ const p=plans[sub]; plans.push({n:p.n+' (Kopie)', it:p.it.map(x => ({...x}))}); sub=plans.length-1; render(); }
function pDel(){ plans.splice(sub,1); sub=null; conf=''; render(); }
function vPlans(){
  if (sub===null) return plans.map((p,i) => `<div class="cd cl" onclick="sub=${i};render()"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">${esc(p.n)}</span><i class="ti ti-chevron-right mu"></i></div><div>${pg(p).map(tg).join('')}</div><div class="mu" style="margin-top:4px">${p.it.map(x => esc(ex[x.e].n)+' '+x.s+'×'+x.r).join(', ')||'Noch leer'}</div></div>`).join('') + `<button class="bt" onclick="pNew()"><i class="ti ti-plus"></i> Neuer Plan</button>`;
  const p=plans[sub];
  let o = `<button onclick="sub=null;conf='';render()" style="margin-bottom:10px"><i class="ti ti-arrow-left"></i> Pläne</button>
  <input value="${esc(p.n)}" oninput="pUpd('n',0,this.value)" style="width:100%;margin-bottom:6px;font-weight:600"><div class="mu" style="margin-bottom:10px">${p.it.reduce((a,x) => a+x.s,0)} Sätze · ${pg(p).map(tg).join('')}</div>`;
  p.it.forEach((x,i) => { o += `<div class="cd" style="padding:10px 12px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:14px">${dot(ex[x.e].g)}${esc(ex[x.e].n)}</span><span class="ic"><i class="ti ti-arrow-up cl" onclick="pMv(${i},-1)"></i><i class="ti ti-arrow-down cl" onclick="pMv(${i},1)"></i><i class="ti ti-trash cl" onclick="pRm(${i})"></i></span></div>
  <div style="display:flex;align-items:center;gap:6px;margin-top:6px" class="mu"><input inputmode="numeric" value="${x.s}" oninput="pUpd('s',${i},this.value)" style="width:56px;height:36px;text-align:center"> Sätze ×<input inputmode="numeric" value="${x.r}" oninput="pUpd('r',${i},this.value)" style="width:56px;height:36px;text-align:center"> Wdh</div></div>`; });
  return o + `<div style="display:flex;gap:6px"><select id="pe" style="flex:1;min-width:0">${opts()}</select><button onclick="pAdd()">Hinzufügen</button></div><button class="bt" onclick="pDup()"><i class="ti ti-copy"></i> Plan kopieren</button>` + (conf==='p' ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="pDel()" style="color:var(--text-danger)">Ja, löschen</button><button onclick="conf='';render()">Behalten</button></div>` : `<button class="bt" onclick="conf='p';render()" style="color:var(--text-danger)">Plan löschen</button>`);
}

// ---------- Fortschritt ----------
function line(vals,col,w,h,lbl){
  if (vals.length<2) return '';
  const mx=Math.max(...vals), mn=Math.min(...vals), xs=i => 10+i*(w-20)/(vals.length-1), ys=v => h-10-(mx===mn?0.5:(v-mn)/(mx-mn))*(h-28);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block"><polyline fill="none" stroke="${col}" stroke-width="2" points="${vals.map((v,i) => xs(i)+','+ys(v)).join(' ')}"/>${vals.map((v,i) => `<circle cx="${xs(i)}" cy="${ys(v)}" r="3.5" fill="${col}"/>`).join('')}<text x="${xs(vals.length-1)}" y="${ys(vals.at(-1))-8}" text-anchor="end" style="font-size:12px;fill:var(--text-secondary)">${lbl}</text></svg>`;
}
function bwAdd(){ const w=num($('bwi').value); if (w===null||w<30||w>300){ err='bw'; render(); return; } bw.push({d:Date.now(), w}); err=''; render(); }
function vStats(){
  let o=banner();
  const w0=wk0(), wk=[5,4,3,2,1,0].map(k => { const a=w0-k*7*864e5, hs=hist.filter(h => h.d>=a && h.d<a+7*864e5); return {a, v:hs.reduce((s,h) => s+vol(h),0)}; }), mv=Math.max(1,...wk.map(x => x.v));
  o += `<div class="cd"><div style="font-weight:600;margin-bottom:8px">Volumen pro Woche</div><div style="display:flex;align-items:flex-end;gap:8px;height:110px">${wk.map((x,k) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><span style="font-size:11px;color:var(--text-secondary)">${x.v?nf(Math.round(x.v/100)/10)+' t':''}</span><div style="width:100%;height:${Math.round(x.v/mv*80)}px;background:${k===5?'var(--fill-accent)':'var(--bg-accent)'};border-radius:4px 4px 0 0;margin-top:3px"></div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:4px">${wk.map((x,k) => `<span style="flex:1;text-align:center;font-size:11px;color:var(--text-muted)">${k===5?'Jetzt':new Date(x.a).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</span>`).join('')}</div></div>`;
  const d7=Date.now()-7*864e5, cnt=G.map(() => 0); hist.filter(h => h.d>=d7).forEach(h => h.x.forEach(x => cnt[ex[x.e].g]+=x.s.length));
  o += `<div class="cd"><div style="font-weight:600">Sätze pro Muskel (7 Tage)</div><div class="mu" style="margin-bottom:6px">Markierung bei 10 Sätzen, Richtwert 10–20</div>` + G.map((g,i) => `<div style="display:grid;grid-template-columns:78px 1fr 26px;gap:8px;align-items:center;font-size:13px;margin-top:7px"><span>${dot(i)}${g}</span><div style="position:relative;height:10px;background:var(--bg-neutral);border-radius:5px"><div style="height:10px;width:${Math.min(100,Math.round(cnt[i]/20*100))}%;background:${GC[i]};border-radius:5px"></div><div style="position:absolute;left:50%;top:-2px;width:1px;height:14px;background:var(--border-stronger)"></div></div><span style="text-align:right">${cnt[i]}</span></div>`).join('') + `</div>`;
  const lb=bw.at(-1), fb=bw[0];
  o += `<div class="cd"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600">Körpergewicht</span><span style="font-size:20px;font-weight:600">${lb?nf(lb.w)+' kg':'–'}</span></div>${bw.length>1?`<div class="mu">${(lb.w-fb.w)<=0?'':'+'}${nf(lb.w-fb.w)} kg seit ${dt(fb.d)}</div>`:''}${line(bw.slice(-20).map(b => b.w),'#1D9E75',330,80,'')}
  <div style="display:flex;gap:6px;margin-top:8px"><input id="bwi" inputmode="decimal" placeholder="81,5" style="flex:1;min-width:0" oninput="if(err){err='';$('be').textContent=''}"><button onclick="bwAdd()">Eintragen</button></div><div class="er" id="be">${err==='bw'?'Gib ein gültiges Gewicht ein.':''}</div></div>`;
  const rec = ex.map((e,i) => { let b=null; hist.forEach(h => h.x.forEach(x => { if (x.e===i) x.s.forEach(s => { const v=e1(s.w,s.r); if (s.w>0 && (!b||v>b.v)) b={v, w:s.w, r:s.r}; }); })); return b ? {i, ...b} : null; }).filter(Boolean).sort((a,b) => b.v-a.v);
  o += `<div class="cd"><div style="font-weight:600">Bestleistungen</div><div class="mu" style="margin-bottom:4px">Geschätztes Maximum für 1 Wiederholung</div>` + (rec.length ? rec.slice(0,8).map((r,k) => `<div class="cl" onclick="tab='ex';sub=${r.i};render()" style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:7px 0;border-bottom:0.5px solid var(--border)"><span>${k<3?`<i class="ti ti-medal" style="color:${['#EF9F27','#888780','#D85A30'][k]}"></i> `:''}${esc(ex[r.i].n)}</span><span><span class="mu">${nf(r.w)}×${r.r} · </span>${Math.round(r.v)} kg</span></div>`).join('') : '<div class="mu">Erscheint nach deinem ersten Training.</div>') + `</div>`;
  return o;
}

// ---------- Übungen ----------
function eAdd(){ const n=$('en').value.trim(); if (!n){ err='en'; render(); return; } if (ex.some(e => e.n.toLowerCase()===n.toLowerCase())){ err='ed'; render(); return; } ex.push({n, g:+$('eg').value, note:''}); err=''; render(); }
function exList(q){
  q=q.toLowerCase(); let o='';
  G.forEach((g,gi) => { const l=ex.map((e,i) => [e,i]).filter(z => z[0].g===gi && z[0].n.toLowerCase().includes(q)); if (!l.length) return;
    o += `<div style="margin:12px 0 4px;font-weight:600;font-size:13px;color:${GC[gi]}">${g}</div>` + l.map(([e,i]) => `<div class="cl" onclick="sub=${i};render()" style="display:flex;justify-content:space-between;padding:11px 2px;border-bottom:0.5px solid var(--border);font-size:15px"><span>${esc(e.n)}${e.note?' <i class="ti ti-note mu"></i>':''}</span><span class="mu">${best(i)>0?nf(best(i))+' kg ':''}<i class="ti ti-chevron-right"></i></span></div>`).join(''); });
  return o || '<div class="mu" style="margin-top:12px">Keine Übung gefunden.</div>';
}
function vEx(){
  let o=banner();
  if (sub!==null){
    const e=sub, E=ex[e], ss=hist.filter(h => h.x.some(x => x.e===e));
    o += `<button onclick="sub=null;render()" style="margin-bottom:10px"><i class="ti ti-arrow-left"></i> Übungen</button><div style="font-size:20px;font-weight:600">${esc(E.n)}</div><div>${tg(E.g)}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0">${[['Bestwert',best(e)>0?nf(best(e))+' kg':'–'],['Einheiten',ss.length],['Sätze',ss.reduce((a,h) => a+h.x.find(x => x.e===e).s.length,0)]].map(m => `<div class="mt"><div class="mu" style="font-size:12px">${m[0]}</div><div style="font-weight:600">${m[1]}</div></div>`).join('')}</div>
    <div class="mu" style="margin-bottom:4px">Notiz</div><input value="${esc(E.note)}" placeholder="Sitzhöhe 4, enger Griff" oninput="ex[${e}].note=this.value;save()" style="width:100%;margin-bottom:10px">`;
    if (!ss.length) return o + '<div class="mu">Noch nie trainiert.</div>';
    const pts=ss.map(h => { const s=h.x.find(x => x.e===e).s; return {d:h.d, s, v:Math.max(...s.map(z => e1(z.w,z.r)))}; });
    if (pts.length>1 && pts.at(-1).v>0) o += `<div class="cd"><div class="mu">Geschätztes Maximum (1 Wdh.)</div>${line(pts.slice(-20).map(p => p.v),GC[E.g],330,100,Math.round(pts.at(-1).v)+' kg')}</div>`;
    if (BB.includes(E.n) && best(e)>0) o += `<div class="cd"><div style="font-size:13px;font-weight:600">Scheiben für deinen Bestwert (${nf(best(e))} kg)</div>${plateViz(best(e))}</div>`;
    pts.slice().reverse().forEach(p => { o += `<div class="cd" style="padding:10px 12px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${dt(p.d)}</span><span style="font-weight:600">${nf(Math.max(...p.s.map(z => z.w)))} kg</span></div><div class="mu">${p.s.map(z => nf(z.w)+'×'+z.r).join(', ')}</div></div>`; });
    return o;
  }
  return o + `<div style="position:relative;margin-bottom:10px"><i class="ti ti-search mu" style="position:absolute;left:10px;top:11px;font-size:16px"></i><input placeholder="Übung suchen" style="width:100%;padding-left:32px" oninput="$('exl').innerHTML=exList(this.value)"></div>
  <div style="display:flex;gap:6px"><input id="en" placeholder="Neue Übung" style="flex:1;min-width:0" oninput="if(err){err='';$('ee').textContent=''}"><select id="eg">${G.map((g,i) => `<option value="${i}">${g}</option>`).join('')}</select><button onclick="eAdd()"><i class="ti ti-plus"></i></button></div><div class="er" id="ee">${err==='en'?'Gib einen Namen ein.':err==='ed'?'Die Übung gibt es schon.':''}</div><div id="exl">${exList('')}</div>`;
}

// ---------- Verlauf ----------
function hDel(){ hist.splice(sub,1); sub=null; conf=''; render(); }
function vHist(){
  let o=banner();
  if (sub!==null){ const h=hist[sub];
    return o + `<button onclick="sub=null;conf='';render()" style="margin-bottom:10px"><i class="ti ti-arrow-left"></i> Verlauf</button><div style="font-size:20px;font-weight:600">${esc(h.p)}</div><div class="mu" style="margin-bottom:10px">${dt(h.d)} · ${h.dur} min · ${nf(vol(h))} kg Volumen</div>` + h.x.map(x => `<div class="cd" style="padding:10px 12px"><div style="font-weight:600;font-size:14px">${dot(ex[x.e].g)}${esc(ex[x.e].n)}</div><div class="mu">${x.s.map(s => nf(s.w)+' kg × '+s.r).join(' · ')}</div></div>`).join('') + (conf==='h' ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button onclick="hDel()" style="color:var(--text-danger)">Ja, löschen</button><button onclick="conf='';render()">Behalten</button></div>` : `<button class="bt" onclick="conf='h';render()" style="color:var(--text-danger)">Training löschen</button>`);
  }
  if (!hist.length) return o + '<div class="mu" style="text-align:center;margin-top:40px">Noch keine Trainings. Dein erstes erscheint hier, sobald du es beendest.</div>';
  let lm='';
  hist.map((h,i) => [h,i]).reverse().forEach(([h,i]) => {
    const m=new Date(h.d).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
    if (m!==lm){ o += `<div class="mu" style="margin:10px 0 6px;font-weight:600">${m}</div>`; lm=m; }
    const gs=[...new Set(h.x.map(x => ex[x.e].g))];
    o += `<div class="cd cl" onclick="sub=${i};render()" style="display:flex;gap:12px;align-items:center"><div style="width:42px;text-align:center"><div style="font-size:18px;font-weight:600">${new Date(h.d).getDate()}</div><div class="mu" style="font-size:11px">${new Date(h.d).toLocaleDateString('de-DE',{weekday:'short'})}</div></div><div style="flex:1"><div style="font-weight:600">${esc(h.p)}</div><div class="mu">${h.x.reduce((a,x) => a+x.s.length,0)} Sätze · ${nf(vol(h))} kg · ${h.dur} min</div><div style="display:flex;gap:3px;margin-top:5px">${gs.map(g => `<div style="height:4px;flex:1;border-radius:2px;background:${GC[g]}"></div>`).join('')}</div></div></div>`;
  });
  return o;
}

// ---------- Einstellungen & Backup ----------
async function exportData(){
  const name = 'gym-backup-' + new Date().toISOString().slice(0,10) + '.json';
  const blob = new Blob([JSON.stringify({ex, plans, hist, bw}, null, 1)], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  // Auf dem iPhone über das Teilen-Menü (z. B. "In Dateien sichern")
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Gym-Backup'}); return; } catch(e){ if (e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
function importData(inp){
  const f=inp.files[0]; if (!f) return;
  const r=new FileReader();
  r.onload = () => {
    try {
      const d=JSON.parse(r.result);
      if (!Array.isArray(d.ex) || !Array.isArray(d.plans) || !Array.isArray(d.hist)) throw 0;
      ex=d.ex; plans=d.plans; hist=d.hist; bw=d.bw||[]; act=null; rest=0;
      msg='Backup geladen: '+hist.length+' Trainings.'; render();
    } catch(e){ msg='Die Datei ist kein gültiges Backup.'; render(); }
  };
  r.readAsText(f);
}
function resetAll(){ const d=defaults(); ({ex, plans, hist, bw, act, rest} = d); conf=''; msg='Alle Daten gelöscht.'; render(); }
function vSet(){
  return `<div class="cd"><div style="font-weight:600">Backup</div><div class="mu" style="margin:4px 0 6px">Deine Daten liegen nur auf diesem iPhone. Mach ab und zu ein Backup, z. B. in die Dateien-App oder iCloud Drive.</div>
  <button class="bt pr" onclick="exportData()"><i class="ti ti-download"></i> Backup erstellen</button>
  <label class="cl" style="display:flex;align-items:center;justify-content:center;gap:6px;height:44px;margin-top:8px;border:0.5px solid var(--border-strong);border-radius:var(--radius)"><i class="ti ti-upload"></i> Backup laden<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label>
  ${msg?`<div class="mu" style="margin-top:8px;color:var(--text-accent)">${msg}</div>`:''}</div>
  <div class="cd"><div style="font-weight:600">Gespeichert</div><div class="mu">${hist.length} Trainings · ${plans.length} Pläne · ${ex.length} Übungen · ${bw.length} Gewichtseinträge</div></div>
  <div class="cd"><div style="font-weight:600">Pausenzeit</div><div class="mu">Immer ${REST/60} Minuten, im Training mit ±30 s anpassbar.</div></div>
  ${conf==='r' ? `<div class="cd" style="border-color:var(--border-danger)"><div style="font-size:14px">Wirklich alles löschen? Das lässt sich ohne Backup nicht rückgängig machen.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="resetAll()" style="color:var(--text-danger)">Alles löschen</button><button onclick="conf='';render()">Abbrechen</button></div></div>` : `<button class="bt" onclick="conf='r';render()" style="color:var(--text-danger)">Alle Daten löschen</button>`}`;
}

// ---------- Anzeige ----------
function render(){
  const T={train:act?act.p:'Training', plans:'Pläne', stats:'Fortschritt', ex:'Übungen', hist:'Verlauf', sum:'Geschafft', set:'Einstellungen'};
  $('ttl').textContent = T[tab];
  $('v').innerHTML = tab==='train'?vTrain() : tab==='sum'?vSum() : tab==='plans'?banner()+vPlans() : tab==='stats'?vStats() : tab==='ex'?vEx() : tab==='set'?vSet() : vHist();
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t===tab || (tab==='sum' && b.dataset.t==='train')));
  save(); upd();
}
// läuft jede Sekunde: Trainingsuhr und Pausenring
function upd(){
  $('clk').innerHTML = act ? '<i class="ti ti-clock"></i> '+mm((Date.now()-act.t0)/1000) : '';
  const r=$('rt');
  if (r){ const rem=(rest-Date.now())/1000; if (rem>0){ r.textContent=mm(rem); $('rr').setAttribute('stroke-dashoffset', C*(1-rem/REST)); } else { rest=0; render(); } }
}
setInterval(upd, 1000);
// Beim Zurückkehren in die App sofort aktualisieren
document.addEventListener('visibilitychange', () => { if (!document.hidden) upd(); });
render();

// Offline-Unterstützung
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
